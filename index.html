<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wei Hang 的 App</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F3F1FB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="总入口">
<script>try{var t=localStorage.getItem("mm-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* ===== Wei Hang Apps 共用设计规则（三个 app 都照这个） =====
   1. 卡片：圆角 20–24px，点进去才看细节
   2. 说明文字收进 ⓘ，不要一大段摊开
   3. 导航在底部
   4. 文字对比够：正文用 --ink，次要用 --ink2，不用更淡的灰
   5. 外观：localStorage "mm-theme" = light / dark / 不设（跟手机），全部 app 共用
   6. 动画：弹出 / 长条生长，尊重「减少动态效果」
   每个 app 的代表色：钱簿 #7C6CF2 · 书斋 #356F62 · 事后诸葛亮 #B8321F */
:root{
  --bg:#F3F1FB;--paper:#FFFFFF;--ink:#1F1D33;--ink2:#5D5A78;--line:#E6E3F3;--shade:rgba(40,30,90,.08);
  --money:#7C6CF2;--book:#356F62;--dec:#B8321F;--ok:#14915F;--warn:#C2410C;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13121C;--paper:#1E1C2C;--ink:#F2F0FF;--ink2:#B4B0D0;--line:#2E2B44;--shade:rgba(0,0,0,.35);--money:#A598FF;--book:#5FB8A2;--dec:#F07A63;--ok:#46D6A0;--warn:#FB923C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13121C;--paper:#1E1C2C;--ink:#F2F0FF;--ink2:#B4B0D0;--line:#2E2B44;--shade:rgba(0,0,0,.35);--money:#A598FF;--book:#5FB8A2;--dec:#F07A63;--ok:#46D6A0;--warn:#FB923C;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.hi small{display:block;color:var(--ink2);font-size:14px;font-weight:600}
.hi h1{margin:2px 0 0;font-size:30px;letter-spacing:.02em}
.tq{border:0;background:var(--paper);box-shadow:0 2px 10px var(--shade);border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;transition:transform .3s}
.tq:active{transform:rotate(40deg) scale(.9)}
.todo{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.todo a{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:16px;padding:12px 14px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;box-shadow:0 2px 10px var(--shade);border-left:4px solid var(--warn);animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}
.todo a span{flex:1}.todo a b{color:var(--ink2)}
.app{position:relative;display:block;background:var(--paper);border-radius:24px;padding:18px;margin-bottom:14px;color:var(--ink);text-decoration:none;box-shadow:0 4px 18px var(--shade);overflow:hidden;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;transition:transform .15s}
.app:active{transform:scale(.97)}
.app::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--c);opacity:.1}
.app:nth-of-type(2){animation-delay:.07s}.app:nth-of-type(3){animation-delay:.14s}
.ah{display:flex;align-items:center;gap:12px}
.ai{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--c) 15%,transparent);flex:none}
.an{flex:1;min-width:0}.an b{display:block;font-size:19px}.an small{color:var(--ink2);font-size:13px;font-weight:600}
.go{color:var(--c);font-size:26px;font-weight:300}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;position:relative;z-index:1}
.st{background:var(--bg);border-radius:14px;padding:10px 12px;min-width:0}
.st small{display:block;color:var(--ink2);font-size:12px;font-weight:600}
.st b{display:block;font-size:17px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.wide{grid-column:1/-1}
.pbar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--c);transform-origin:left;animation:grow 1s .25s cubic-bezier(.34,1.3,.64,1) both}
.none{margin-top:12px;color:var(--ink2);font-size:13px;position:relative;z-index:1}
h2{font-size:15px;color:var(--ink2);margin:24px 4px 10px}
.bk{background:var(--paper);border-radius:20px;padding:6px 14px;box-shadow:0 2px 10px var(--shade)}
.bk div{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.bk div:first-child{border-top:0}
.bk .ok{color:var(--ok);font-weight:700}.bk .old{color:var(--warn);font-weight:700}.bk .na{color:var(--ink2)}
.ib{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:0;margin-left:6px;background:color-mix(in srgb,var(--money) 16%,transparent);color:var(--money);font:italic 800 12px/1 Georgia,serif;cursor:pointer;vertical-align:2px}
.bub{display:none;background:var(--paper);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.6;color:var(--ink);margin:-2px 4px 10px;box-shadow:0 2px 10px var(--shade)}
.bub.show{display:block;animation:pop .3s cubic-bezier(.34,1.56,.64,1) both}
.foot{text-align:center;color:var(--ink2);font-size:12px;margin-top:22px}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hi"><small id="date"></small><h1 id="greet">你好</h1></div>
    <button class="tq" id="tq" aria-label="换深色 / 浅色">🌙</button>
  </header>
  <div class="todo" id="todo"></div>

  <a class="app" href="./moneybook/" style="--c:var(--money)">
    <div class="ah"><div class="ai">💰</div><div class="an"><b>我的钱簿</b><small>记账 · 预算 · 存款目标</small></div><span class="go">›</span></div>
    <div id="mb"></div>
  </a>
  <a class="app" href="./books/" style="--c:var(--book)">
    <div class="ah"><div class="ai">📚</div><div class="an"><b>书斋</b><small>看书 · 划线 · 笔记</small></div><span class="go">›</span></div>
    <div id="sz"></div>
  </a>
  <a class="app" href="./DecisionMaker/" style="--c:var(--dec)">
    <div class="ah"><div class="ai">🔮</div><div class="an"><b>事后诸葛亮</b><small>决定 · 锦囊 · 复盘</small></div><span class="go">›</span></div>
    <div id="dm"></div>
  </a>

  <h2>☁️ 备份<button class="ib" id="bkI" aria-label="说明">i</button></h2>
  <p class="bub" id="bkB">钱簿和事后诸葛亮会自动备份到 Google Drive 的「Wei Hang Apps 备份」文件夹。书斋的书和划线存在 Supabase 云端，想多一份可以在书斋的「⋯ → 导出备份文件」手动存。这里显示的是这台设备上看到的最后一次备份。</p>
  <div class="bk" id="bk"></div>
  <p class="foot">数字是从这台设备上的资料算的，打开 app 同步之后会更新。</p>
</div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const J=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const m0=n=>(n<0?"−":"")+Math.round(Math.abs(n)).toLocaleString("en-MY");
const pad=n=>String(n).padStart(2,"0");
const now=new Date(), today=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
const ago=t=>{if(!t)return null;const d=new Date(typeof t==="object"?(t.at||t.time||t.date):t);if(isNaN(d))return null;const days=Math.floor((now-d)/86400000);return{days,txt:days<=0?"今天":days===1?"昨天":days+" 天前"}};

/* theme (shared with all apps) */
function themeNow(){const t=document.documentElement.dataset.theme;if(t)return t;try{return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){return"light"}}
function paintTq(){const d=themeNow()==="dark";$("#tq").textContent=d?"☀️":"🌙";document.querySelector('meta[name="theme-color"]').content=d?"#13121C":"#F3F1FB"}
$("#tq").onclick=()=>{const n=themeNow()==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("mm-theme",n)}catch(e){}paintTq()};
window.addEventListener("storage",e=>{if(e.key==="mm-theme"){const v=e.newValue;if(v==="dark"||v==="light")document.documentElement.dataset.theme=v;else delete document.documentElement.dataset.theme;paintTq()}});
paintTq();

/* greeting */
const h=now.getHours();
$("#greet").textContent=(h<5?"夜深了":h<11?"早安":h<14?"午安":h<18?"下午好":"晚上好")+" 👋";
$("#date").textContent=`${now.getMonth()+1}月${now.getDate()}日 星期${"日一二三四五六"[now.getDay()]}`;

const todo=[], bk=[];

/* 我的钱簿 */
(function(){
  const c=J("moneybook-cache-v1",null);
  if(!c||!c.meta){$("#mb").innerHTML='<p class="none">这台设备还没打开过钱簿。</p>';bk.push(["💰 钱簿",null]);return}
  const meta=c.meta, months=c.months||{}, y=String(now.getFullYear()), ym=y+"-"+pad(now.getMonth()+1);
  let yi=0,yo=0,mi=0,mo=0,todayN=0;
  Object.keys(months).forEach(k=>(months[k]||[]).forEach(t=>{
    if(!t||!t.date||t.date>today)return;
    if(t.date===today)todayN++;
    const inY=t.date.slice(0,4)===y, inM=t.date.slice(0,7)===ym;
    if(t.type==="income"){if(inY)yi+=t.amount;if(inM)mi+=t.amount}
    else if(t.type==="expense"){if(inY)yo+=t.amount;if(inM)mo+=t.amount}
  }));
  const g=meta.goal||{}, goal=g[y]!=null?g[y]:(g.def!=null?g.def:25000), saved=yi-yo, p=goal>0?Math.max(0,Math.min(100,saved/goal*100)):0;
  $("#mb").innerHTML=`<div class="stats">
    <div class="st wide"><small>🐷 ${y} 存款目标</small><b>RM ${m0(saved)} / ${m0(goal)}（${Math.round(p)}%）</b><div class="pbar"><i style="width:${p}%"></i></div></div>
    <div class="st"><small>这个月花了</small><b>RM ${m0(mo)}</b></div>
    <div class="st"><small>这个月存了</small><b>RM ${m0(mi-mo)}</b></div></div>`;
  if(!todayN&&h>=19)todo.push(["💰","今天还没记账","./moneybook/?add=1"]);
  bk.push(["💰 钱簿",meta.lastDriveBackup||meta.lastBackup]);
})();

/* 书斋 */
(function(){
  const lib=[...J("sz.lib",[]),...J("sz.local",[])];
  if(!lib.length){$("#sz").innerHTML='<p class="none">这台设备的书架是空的，或者还没打开过书斋。</p>';bk.push(["📚 书斋","na"]);return}
  const prog=b=>{const l=J("sz.p."+b.id,null),r=b.progress;return l&&(!r||(l.at||0)>=(r.at||0))?l:r||null};
  const reading=lib.map(b=>({b,p:prog(b)})).filter(x=>x.p&&x.p.pct<0.995&&(x.b.status||"reading")==="reading").sort((a,c)=>(c.p.at||0)-(a.p.at||0))[0];
  let hl=0,notes=0;try{Object.keys(localStorage).filter(k=>k.startsWith("sz.hl.")).forEach(k=>{const v=J(k,{});(v.items||[]).forEach(i=>{hl++;if(i.note)notes++})})}catch(e){}
  const pct=reading?Math.max(1,Math.round(reading.p.pct*100)):0;
  $("#sz").innerHTML=`<div class="stats">
    ${reading?`<div class="st wide"><small>📖 在读</small><b>《${esc(reading.b.title)}》${pct}%</b><div class="pbar"><i style="width:${pct}%"></i></div></div>`:`<div class="st wide"><small>📖 在读</small><b>没有在读的书</b></div>`}
    <div class="st"><small>书架</small><b>${lib.length} 本</b></div>
    <div class="st"><small>划线 / 笔记</small><b>${hl} / ${notes}</b></div></div>`;
  bk.push(["📚 书斋","na"]);
})();

/* 事后诸葛亮 */
(function(){
  const c=J("shzgl:v1",null), list=c&&c.decisions||[];
  if(!c){$("#dm").innerHTML='<p class="none">这台设备还没打开过事后诸葛亮。</p>';bk.push(["🔮 事后诸葛亮",null]);return}
  const iso=now.toISOString();
  const thinking=list.filter(d=>d.status!=="decided"&&d.status!=="ruled").length;
  const sealed=list.filter(d=>d.status==="decided"||d.status==="ruled").length;
  const due=list.filter(d=>d.status==="decided"&&(d.reviews||[]).some(r=>!r.done&&r.due<=iso));
  $("#dm").innerHTML=`<div class="stats">
    <div class="st"><small>考虑中</small><b>${thinking} 个</b></div>
    <div class="st"><small>已封存锦囊</small><b>${sealed} 个</b></div>
    ${due.length?`<div class="st wide"><small>⏰ 该复盘了</small><b>${esc(due.map(d=>d.title).join("、"))}</b></div>`:""}</div>`;
  due.slice(0,3).forEach(d=>todo.push(["🔮",`「${d.title}」该复盘了`,"./DecisionMaker/#d-"+d.id]));
  bk.push(["🔮 事后诸葛亮",c.settings&&c.settings.lastBackup]);
})();

$("#todo").innerHTML=todo.map(([e,t,u])=>`<a href="${esc(u)}">${e}<span>${esc(t)}</span><b>›</b></a>`).join("");
$("#bk").innerHTML=bk.map(([n,t])=>{if(t==="na")return `<div><span>${n}</span><span class="na">存在 Supabase 云端</span></div>`;const a=ago(t);return `<div><span>${n}</span>${a?`<span class="${a.days>2?"old":"ok"}">${a.days>2?"⚠️ ":"✅ "}${a.txt}</span>`:'<span class="na">这台设备没有纪录</span>'}</div>`}).join("");
$("#bkI").onclick=()=>{$("#bkB").classList.toggle("show")};
window.addEventListener("pageshow",e=>{if(e.persisted)location.reload()});
if("serviceWorker" in navigator&&window.isSecureContext){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
</body>
</html>
